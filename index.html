<!DOCTYPE html>
<html lang="zh-Hant-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAO CHIEN &amp; HUI WEN | 婚禮邀請</title>
    <!-- Google Fonts: Cormorant Garamond & Noto Serif TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Noto+Serif+TC:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        morandi: {
                            gold: '#d4a373',      /* 暖陽金 */
                            goldLight: '#faedcd', /* 柔沙 */
                            sage: '#8da399',      /* 尤加利綠 */
                            sageLight: '#e8ece9', /* 淺葉綠 */
                            sand: '#fefae0',      /* 象牙沙 */
                            dark: '#3d3d3d',      /* 炭灰 */
                            cream: '#fdfbf7'      /* 極致暖白 */
                        }
                    },
                    fontFamily: {
                        cormorant: ['"Cormorant Garamond"', 'serif'],
                        noto: ['"Noto Serif TC"', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #fdfbf7;
            color: #3d3d3d;
        }
        
        .glass-nav {
            background: rgba(253, 251, 247, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(212, 163, 115, 0.15);
        }

        .shimmer-card {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 30px -5px rgba(212, 163, 115, 0.12), 
                        0 4px 12px -2px rgba(141, 163, 153, 0.08);
            position: relative;
            overflow: hidden;
        }

        .shimmer-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 200%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            transform: translateX(-100%);
            animation: shimmer 4s infinite linear;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(50%); }
        }

        .nowrap-item {
            display: inline-block;
            white-space: nowrap;
        }

        .accordion-content, .dynamic-field {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease-out;
            opacity: 0;
        }

        .accordion-content.open, .dynamic-field.open {
            opacity: 1;
        }

        .music-spin {
            animation: spin-slow 6s linear infinite;
        }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="overflow-x-hidden">

    <audio id="bgMusic" loop preload="auto" playsinline>
        <source src="https://sndup.net/dz5mc/d" type="audio/mpeg">
        您的瀏覽器不支援背景音樂播放。
    </audio>

    <div id="musicToggleBtn" class="fixed bottom-6 right-6 z-50 w-12 h-12 bg-white/95 backdrop-blur-md rounded-full shadow-lg border border-morandi-gold/25 flex items-center justify-center cursor-pointer text-morandi-gold transition-all duration-300 hover:scale-110 active:scale-95 group" onclick="toggleMusic(event)">
        <div class="relative w-full h-full flex items-center justify-center">
            <i id="musicIcon" class="fa-solid fa-music text-lg"></i>
            <span id="musicRing" class="absolute inset-0 rounded-full border border-morandi-gold/40 opacity-0"></span>
            <div id="musicTip" class="absolute -top-12 right-0 bg-morandi-gold text-white text-[11px] px-3 py-1.5 rounded-xl whitespace-nowrap shadow-md transition-all duration-500 scale-100 opacity-100">
                點擊播放音樂 ♫
                <span class="absolute bottom-[-4px] right-5 w-2 h-2 bg-morandi-gold rotate-45"></span>
            </div>
        </div>
    </div>

    <nav class="fixed top-0 left-0 w-full z-50 glass-nav transition-all duration-300">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="#" class="font-cormorant text-xl md:text-2xl font-semibold tracking-[0.2em] text-morandi-gold">
                H &amp; W
            </a>
            <div class="flex space-x-6 md:space-x-10 text-sm md:text-base font-medium tracking-wider">
                <a href="#about" class="hover:text-morandi-gold transition-colors duration-300">關於我們</a>
                <a href="#details" class="hover:text-morandi-gold transition-colors duration-300">婚禮詳情</a>
                <a href="#reply" class="hover:text-morandi-gold transition-colors duration-300">出席回函</a>
            </div>
        </div>
    </nav>

    <header class="relative w-full h-screen flex flex-col items-center justify-center text-center overflow-hidden">
        <div class="absolute inset-0 bg-cover bg-no-repeat transition-transform duration-1000 scale-105" 
             style="background-image: url('https://i.postimg.cc/MG2s7m3M/LEE02506.jpg'), linear-gradient(to bottom, rgba(61,61,61,0.35), rgba(212,163,115,0.25)); background-blend-mode: overlay; background-position: center 15%;">
        </div>
        
        <div class="relative z-10 px-4 flex flex-col items-center max-w-4xl text-white">
            <span class="font-cormorant text-base sm:text-lg md:text-xl tracking-[0.3em] uppercase mb-4 opacity-90">Our Wedding Day</span>
            <h1 class="font-cormorant text-3xl sm:text-5xl md:text-6xl lg:text-7xl font-light tracking-[0.12em] leading-tight my-2 whitespace-nowrap">
                HAO CHIEN <span class="font-light italic text-morandi-gold">&amp;</span> HUI WEN
            </h1>
            <div class="w-16 h-[1px] bg-white/60 my-6"></div>
            <p class="font-noto text-lg sm:text-2xl font-light tracking-[0.25em] mb-1 drop-shadow-sm whitespace-nowrap">
                敬我們 · 敬餘生
            </p>
            <p class="font-cormorant text-sm sm:text-base italic tracking-widest opacity-90 mb-8 drop-shadow-sm whitespace-nowrap">
                Cheers to us
            </p>
            <p class="font-cormorant text-base sm:text-lg tracking-[0.2em] opacity-90 border-t border-b border-white/30 py-2 px-6">
                2026 . 10 . 03
            </p>
        </div>
    </header>

    <section id="about" class="relative py-24 px-6 max-w-5xl mx-auto text-center">
        <!-- (計時器區塊保持不變) -->
        <div class="mt-16 max-w-xl mx-auto space-y-6">
            <h3 class="font-noto text-xl font-semibold tracking-widest text-morandi-gold">關於我們 ABOUT US</h3>
            <p class="font-noto text-sm sm:text-base leading-relaxed text-neutral-600 font-light px-4">
                生命中每一次溫慢的相遇，都是歲月最好的餽贈。<br>
                在眾多風景中，我們找到了彼此，決定攜手踏入人生的下一段旅程。
            </p>
        </div>
    </section>

    <!-- 婚禮詳情與垂直 V-Card 設計 (午宴卡片已改為置中) -->
    <section id="details" class="bg-morandi-sageLight/40 py-24 px-6">
        <div class="max-w-6xl mx-auto">
            <div class="text-center mb-16">
                <h2 class="font-cormorant text-3xl md:text-4xl text-morandi-gold tracking-[0.2em] mb-3">WEDDING DETAILS</h2>
                <p class="font-noto text-sm tracking-widest text-neutral-500">婚禮重要時刻與地點</p>
            </div>

            <!-- 使用 flex 讓卡片容器本身置中 -->
            <div class="flex justify-center items-start">
                <div class="bg-white rounded-3xl p-8 sm:p-10 shadow-lg border border-neutral-100 flex flex-col items-center text-center transform hover:-translate-y-2 transition-transform duration-300 max-w-md w-full">
                    <div class="w-12 h-12 rounded-full bg-morandi-sage/10 flex items-center justify-center text-morandi-sage mb-6">
                        <i class="fa-solid fa-champagne-glasses text-xl"></i>
                    </div>
                    <span class="font-cormorant text-xs tracking-widest text-morandi-gold uppercase mb-2 font-semibold">The Banquet</span>
                    <h3 class="font-noto text-2xl font-semibold text-morandi-dark mb-6">溫馨午宴</h3>
                    
                    <div class="w-full h-[1px] bg-neutral-100 mb-6"></div>
                    
                    <ul class="space-y-4 text-sm sm:text-base font-light text-neutral-600 w-full">
                        <li>
                            <strong class="font-semibold text-morandi-dark block mb-1">地點 LOCATION</strong>
                            <span class="nowrap-item font-semibold text-morandi-gold text-lg">翡麗詩莊園</span>
                        </li>
                        <li>
                            <strong class="font-semibold text-morandi-dark block mb-1">時間 TIME</strong>
                            <span class="nowrap-item">12：00入席</span> ｜ <span class="nowrap-item">12：30開席</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </section>

    <!-- (其餘結構與腳本保持不變) -->

    <script>
        // 腳本保持不變...
    </script>
</body>
</html>
